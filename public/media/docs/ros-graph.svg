<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Grafo publicador y suscriptor de ROS 2</title>
  <desc id="desc">Un nodo Talker publica mensajes en el topic mensaje, que los entrega a un nodo Listener.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <g fill="none" stroke="#f2f6f1" stroke-opacity=".18" stroke-width="1">
    <circle cx="168" cy="180" r="82"/>
    <circle cx="792" cy="180" r="82"/>
  </g>

  <g fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)">
    <path d="M250 180H403"/>
    <path d="M557 180H710"/>
  </g>

  <g font-family="'JetBrains Mono', 'Courier New', monospace" text-anchor="middle">
    <text x="168" y="174" fill="#f2f6f1" font-size="25" font-weight="600">Talker</text>
    <text x="168" y="209" fill="#8d9892" font-size="20" letter-spacing="2">PUBLICA</text>

    <text x="480" y="174" fill="#4ade80" font-size="24" font-weight="600">mensaje</text>
    <text x="480" y="209" fill="#8d9892" font-size="20" letter-spacing="2">STD_MSGS / STRING</text>

    <text x="792" y="174" fill="#f2f6f1" font-size="25" font-weight="600">Listener</text>
    <text x="792" y="209" fill="#8d9892" font-size="20" letter-spacing="2">RECIBE</text>
  </g>

  <g fill="#8d9892" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="19" letter-spacing="1.5">
    <text x="86" y="72">NODO 01</text>
    <text x="710" y="72">NODO 02</text>
  </g>
</svg>
