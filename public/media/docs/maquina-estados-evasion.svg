<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Máquina de estados de la evasión de obstáculos</title>
  <desc id="desc">Dos estados, Avanzar y Girar, con dos transiciones: hay un obstáculo lleva de Avanzar a Girar, y ya giró lo suficiente lleva de Girar a Avanzar.</desc>
  <defs>
    <marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#4ade80"/>
    </marker>
    <marker id="state-arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f2f6f1"/>
    </marker>
  </defs>

  <g fill="#8d9892" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="19" letter-spacing="1.5">
    <text x="60" y="52">MÁQUINA DE ESTADOS</text>
    <text x="60" y="80" fill="#f2f6f1" font-size="22">EVASIÓN DE OBSTÁCULOS</text>
  </g>

  <path d="M311.6 176.3 Q480 40 648.4 176.3" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#state-arrow)"/>
  <path d="M648.4 323.7 Q480 420 311.6 323.7" fill="none" stroke="#f2f6f1" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#state-arrow-white)"/>

  <g font-family="'JetBrains Mono', 'Courier New', monospace" text-anchor="middle">
    <text x="480" y="66" fill="#4ade80" font-size="21" font-weight="600">hay_obstaculo()</text>
    <text x="480" y="440" fill="#f2f6f1" font-size="21" font-weight="600">angulo_girado() ≥ objetivo</text>
  </g>

  <g>
    <circle cx="260" cy="250" r="90" fill="#07100c" stroke="#4ade80" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="700" cy="250" r="90" fill="#07100c" stroke="#f2f6f1" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <g font-family="'JetBrains Mono', 'Courier New', monospace" text-anchor="middle">
    <text x="260" y="242" fill="#f2f6f1" font-size="27" font-weight="600">AVANZAR</text>
    <text x="260" y="270" fill="#8d9892" font-size="14" letter-spacing="1.5">ESTADO_AVANZAR</text>

    <text x="700" y="242" fill="#f2f6f1" font-size="27" font-weight="600">GIRAR</text>
    <text x="700" y="270" fill="#8d9892" font-size="14" letter-spacing="1.5">ESTADO_GIRAR</text>
  </g>
</svg>
