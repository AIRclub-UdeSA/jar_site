<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Animación de qué rayos del lidar y qué píxeles de la cámara corresponden al cuadrado rojo</title>
  <desc id="desc">A la izquierda, los 360° del lidar alrededor del robot: la mayoría de los rayos llegan al límite del rango sin encontrar nada, salvo tres que pegan realmente contra el cuadrado rojo y quedan prendidos. A la derecha, la vista de cámara con puntos correspondientes: solo los que caen dentro del cuadrado rojo están prendidos.</desc>

  <line x1="520" y1="10" x2="520" y2="510" stroke="#f2f6f1" stroke-opacity=".1"/>

  <!-- ===================== PANEL IZQUIERDO: LIDAR 360° ===================== -->
  <g transform="translate(20,20)">
    <text x="0" y="14" fill="#8d9892" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="17" letter-spacing="1.5">LIDAR · 360°</text>

    <circle cx="240" cy="240" r="180" fill="none" stroke="#f2f6f1" stroke-opacity=".08"/>

    <!-- rayos que no encuentran nada: llegan al límite del rango, apagados -->
    <g stroke="#f2f6f1" stroke-opacity=".18" stroke-width="1.5">
      <line x1="240" y1="240" x2="409.1" y2="301.6"/>
      <line x1="240" y1="240" x2="395.9" y2="330"/>
      <line x1="240" y1="240" x2="377.9" y2="355.7"/>
      <line x1="240" y1="240" x2="355.7" y2="377.9"/>
      <line x1="240" y1="240" x2="330" y2="395.9"/>
      <line x1="240" y1="240" x2="301.6" y2="409.1"/>
      <line x1="240" y1="240" x2="271.2" y2="417.3"/>
      <line x1="240" y1="240" x2="240" y2="420"/>
      <line x1="240" y1="240" x2="208.8" y2="417.3"/>
      <line x1="240" y1="240" x2="178.4" y2="409.1"/>
      <line x1="240" y1="240" x2="150" y2="395.9"/>
      <line x1="240" y1="240" x2="124.3" y2="377.9"/>
      <line x1="240" y1="240" x2="102.1" y2="355.7"/>
      <line x1="240" y1="240" x2="84.1" y2="330"/>
      <line x1="240" y1="240" x2="70.9" y2="301.6"/>
      <line x1="240" y1="240" x2="62.7" y2="271.2"/>
      <line x1="240" y1="240" x2="60" y2="240"/>
      <line x1="240" y1="240" x2="62.7" y2="208.8"/>
      <line x1="240" y1="240" x2="70.9" y2="178.4"/>
      <line x1="240" y1="240" x2="84.1" y2="150"/>
      <line x1="240" y1="240" x2="102.1" y2="124.3"/>
      <line x1="240" y1="240" x2="124.3" y2="102.1"/>
      <line x1="240" y1="240" x2="150" y2="84.1"/>
      <line x1="240" y1="240" x2="178.4" y2="70.9"/>
      <line x1="240" y1="240" x2="208.8" y2="62.7"/>
      <line x1="240" y1="240" x2="240" y2="60"/>
      <line x1="240" y1="240" x2="271.2" y2="62.7"/>
      <line x1="240" y1="240" x2="301.6" y2="70.9"/>
      <line x1="240" y1="240" x2="330" y2="84.1"/>
      <line x1="240" y1="240" x2="355.7" y2="102.1"/>
      <line x1="240" y1="240" x2="377.9" y2="124.3"/>
      <line x1="240" y1="240" x2="395.9" y2="150"/>
      <line x1="240" y1="240" x2="409.1" y2="178.4"/>
    </g>

    <!-- cuadrado rojo -->
    <rect x="352" y="217" width="46" height="46" rx="5" fill="#0b120f" stroke="#f87171" stroke-width="2">
      <animate attributeName="stroke-width" dur="1.1s" repeatCount="indefinite" values="2;3.5;2"/>
    </rect>

    <!-- los tres rayos que sí pegan (y terminan) adentro del cuadrado: prendidos -->
    <g stroke="#4ade80">
      <line x1="240" y1="240" x2="375" y2="222">
        <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="0.5;1;0.5"/>
        <animate attributeName="stroke-width" dur="1.1s" repeatCount="indefinite" values="2;3.5;2"/>
      </line>
      <line x1="240" y1="240" x2="375" y2="240">
        <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="0.5;1;0.5" begin="0.15s"/>
        <animate attributeName="stroke-width" dur="1.1s" repeatCount="indefinite" values="2;3.5;2" begin="0.15s"/>
      </line>
      <line x1="240" y1="240" x2="375" y2="258">
        <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="0.5;1;0.5" begin="0.3s"/>
        <animate attributeName="stroke-width" dur="1.1s" repeatCount="indefinite" values="2;3.5;2" begin="0.3s"/>
      </line>
    </g>

    <!-- robot, en el centro del scan -->
    <circle cx="240" cy="240" r="14" fill="#07100c" stroke="#4ade80" stroke-width="2"/>
    <line x1="240" y1="240" x2="256" y2="240" stroke="#4ade80" stroke-width="2"/>
  </g>

  <!-- ===================== PANEL DERECHO: VISTA DE CÁMARA ===================== -->
  <g transform="translate(560,20)">
    <text x="0" y="14" fill="#8d9892" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="17" letter-spacing="1.5">VISTA DE CÁMARA</text>

    <rect x="0" y="40" width="300" height="220" fill="#07100c" stroke="#f2f6f1" stroke-opacity=".2"/>

    <!-- el mismo cuadrado rojo, visto por la cámara -->
    <rect x="128" y="128" width="44" height="44" rx="4" fill="#0b120f" stroke="#f87171" stroke-width="2">
      <animate attributeName="stroke-width" dur="1.1s" repeatCount="indefinite" values="2;3.5;2"/>
    </rect>

    <!-- puntos que no caen sobre el rojo: apagados -->
    <g fill="#f2f6f1" opacity=".28">
      <circle cx="20" cy="150" r="5"/>
      <circle cx="63.3" cy="150" r="5"/>
      <circle cx="236.7" cy="150" r="5"/>
      <circle cx="280" cy="150" r="5"/>
    </g>

    <!-- puntos que sí caen (y quedan) adentro del cuadrado rojo: prendidos -->
    <g fill="#4ade80">
      <circle cx="136" cy="140" r="7">
        <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="0.5;1;0.5"/>
        <animate attributeName="r" dur="1.1s" repeatCount="indefinite" values="6;8.5;6"/>
      </circle>
      <circle cx="150" cy="150" r="7">
        <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="0.5;1;0.5" begin="0.15s"/>
        <animate attributeName="r" dur="1.1s" repeatCount="indefinite" values="6;8.5;6" begin="0.15s"/>
      </circle>
      <circle cx="164" cy="160" r="7">
        <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="0.5;1;0.5" begin="0.3s"/>
        <animate attributeName="r" dur="1.1s" repeatCount="indefinite" values="6;8.5;6" begin="0.3s"/>
      </circle>
    </g>

    <text x="150" y="292" fill="#8d9892" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" letter-spacing="1" text-anchor="middle">puntos dentro de la máscara roja</text>
  </g>
</svg>
